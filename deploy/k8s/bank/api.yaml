# The web chat and the agents. The model is the self-hosted vLLM behind the session router.
#   kubectl -n bank port-forward svc/api 8000:8000   ->  http://127.0.0.1:8000
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: bank-app                 # set in kustomization.yaml (your ECR image)
          envFrom:
            - secretRef: {name: bank-env}
          env:                             # these win over anything in bank-env
            - {name: MODEL, value: "vllm:openai/gpt-oss-20b"}
            - {name: VLLM_BASE_URL, value: "http://vllm-router-service.llm.svc.cluster.local/v1"}
            - {name: LANGSMITH_PROJECT, value: banking-agent-vllm}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            - {name: DATABASE_URL, value: "postgresql://bank:$(POSTGRES_PASSWORD)@postgres:5432/bank"}
            - {name: MCP_ACCOUNTS_URL, value: "http://mcp:8101/mcp"}
            - {name: MCP_TRANSACTIONS_URL, value: "http://mcp:8102/mcp"}
            - {name: MCP_SERVICE_URL, value: "http://mcp:8103/mcp"}
            - {name: MCP_CHARTS_URL, value: "http://mcp:8105/mcp"}
            - {name: VERIFY_URL, value: "http://mcp:8104"}
            - {name: API_HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: COOKIE_SECURE, value: "0"}   # reached through kubectl port-forward on plain http
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1536Mi}
