# Prometheus for the phase 0 GPU machine: reads vLLM's metrics every 5 seconds.
# vLLM publishes them at /metrics (queue, KV cache, prefix cache, time to first token, tokens).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]          # the vllm service on the compose network
        labels:
          instance: gpu-machine
